
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: k8s-production-lab:v1.0.0
    container_name: k8s-lab-api
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
