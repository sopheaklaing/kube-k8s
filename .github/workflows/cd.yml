name: Kubernetes CD

on:
  workflow_run:
    workflows:
      - Python API CI/CD
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to K3s
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')

    runs-on: ubuntu-24.04

    steps:
      - name: Validate deployment image
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if ! printf '%s' "$IMAGE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid commit SHA"
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.K3S_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact image to K3s
        env:
          K3S_HOST: ${{ secrets.K3S_HOST }}
          K3S_USER: ${{ secrets.K3S_USER }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu

          IMAGE="ghcr.io/sopheaklaing/kube-k8s:${IMAGE_SHA}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$K3S_USER@$K3S_HOST" \
            "sudo /usr/local/sbin/deploy-k8s-production-lab '$IMAGE'"