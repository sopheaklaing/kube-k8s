name: Python API CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-build-scan-publish:
    name: Test, Build, Scan and Publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze

      - name: Run tests
        run: python -m pytest -v

      - name: Set lowercase image name
        shell: bash
        run: |
          set -eu
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          set -eu
          docker build \
            --pull \
            -t "$IMAGE_NAME:$GITHUB_SHA" \
            .

      - name: Verify installed package versions
        run: |
          set -eu
          docker run --rm \
            --entrypoint python \
            "$IMAGE_NAME:$GITHUB_SHA" \
            -c "import importlib.metadata as m; print('\n'.join(f'{p}=={m.version(p)}' for p in ['msgpack','setuptools','urllib3']))"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish scanned image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          set -eu

          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"

          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"